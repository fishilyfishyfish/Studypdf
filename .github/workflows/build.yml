name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          mkdir -p proj/app proj/app/src/main proj/app/src/main/java/app/jeongdap proj/app/src/main/res/drawable proj/app/src/main/res/layout proj/app/src/main/res/mipmap-anydpi-v26 proj/app/src/main/res/values proj/app/src/main/res/values-night proj/app/src/main/res/xml
          cat > 'proj/app/build.gradle.kts' << 'EOF_FILE'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "app.jeongdap"
              compileSdk = 35

              defaultConfig {
                  applicationId = "app.jeongdap"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += setOf(
                          "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA",
                          "META-INF/versions/**", "META-INF/LICENSE*", "META-INF/NOTICE*"
                      )
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("com.tom-roush:pdfbox-android:2.0.27.0")
          }
